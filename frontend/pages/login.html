<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - AIP</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/assets/logo.png" alt="AIP Logo" class="auth-logo" />
        <h1>Welcome Back</h1>
        <p>Login to continue your immigration application.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input 
            type="email" 
            id="email" 
            placeholder="Enter your email" 
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Enter your password" 
            required
          />
        </div>

        <button type="submit" class="auth-btn">Login</button>

        <p id="message" class="message"></p>
      </form>

      <p class="auth-footer-text">
        Don't have an account?
        <a href="register.html">Create one</a>
      </p>

      <a href="/pages/home.html" class="back-link">← Back to Home</a>
    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
